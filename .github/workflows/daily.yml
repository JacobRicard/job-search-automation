name: Daily Job Search

# Edit the cron expression below to change when this runs.
# Default: 9:00 AM UTC every day. Use https://crontab.guru to build your schedule.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_DIR: data
      DB_DIR: data
      TZ: ${{ secrets.TZ || 'UTC' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      DIGEST_MIN_SCORE: ${{ secrets.DIGEST_MIN_SCORE || '6' }}
      JOBSPY_ENABLED: ${{ secrets.JOBSPY_ENABLED || 'false' }}
      # Optional Gmail/Outlook rejection sync
      GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      IMAP_PROVIDER: ${{ secrets.IMAP_PROVIDER || 'gmail' }}
      IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
      IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Profile data is stored as base64-encoded GitHub secrets.
      # Generate with:
      #   base64 -i data/companies.js | tr -d '\n'   (macOS)
      #   base64 -w 0 data/companies.js              (Linux)
      - name: Restore profile data
        run: |
          mkdir -p data
          echo "${{ secrets.DATA_COMPANIES_JS }}" | base64 -d > data/companies.js
          echo "${{ secrets.DATA_CONTEXT_MD }}"   | base64 -d > data/context.md
          echo "${{ secrets.DATA_RESUME_MD }}"    | base64 -d > data/resume.md

      # Cache the SQLite database between runs so job history persists.
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Run pipeline
        run: node scripts/refresh.js --skip-discover --skip-closed-check --skip-market-research --skip-slug-check --skip-digest

      - name: Send email digest
        run: node scripts/send-email-digest.js
